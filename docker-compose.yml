services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: shopsphere-backend:1.0.0
    container_name: shopsphere-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - HOSTNAME=shopsphere-backend-container-01
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - shopsphere-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: shopsphere-frontend:1.0.0
    container_name: shopsphere-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shopsphere-network

networks:
  shopsphere-network:
    name: shopsphere-network
    driver: bridge
