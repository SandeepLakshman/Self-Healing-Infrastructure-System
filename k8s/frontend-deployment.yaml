apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-frontend
  labels:
    app: shopsphere-frontend
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopsphere-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: shopsphere-frontend
        tier: web
    spec:
      containers:
        - name: shopsphere-frontend
          image: shopsphere-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
